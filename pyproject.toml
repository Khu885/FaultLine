[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "faultline"
version = "0.1.0"
description = "A deterministic pytest failure analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FaultLine contributors" }]
dependencies = [
    "groq==1.7.0",
    "pydantic==2.11.7",
    "pytest==8.4.2",
    "pytest-json-report==1.5.0",
    "rich==14.1.0",
    "typer==0.16.1",
]

[project.scripts]
faultline = "faultline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = []
